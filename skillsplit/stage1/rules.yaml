# skillsplit stage 1 - starter ruleset (v0, 2026-09-25)
#
# Regex dialect: Python `re`. Every rule is compiled with re.IGNORECASE | re.MULTILINE
# unless `case_sensitive: true`. Patterns are matched against the whole file text, so
# `[\s\S]{0,N}` windows may span lines.
#
# file_types: markdown | shell | python | js | any   (scan.py maps extensions to these;
#   SKILL.md is `markdown`; .txt/.json/.yaml only get `any` rules)
#
# source: where the pattern IDEA came from. "ours" = written by the Textrap team.
#   Licenses of upstream sources (verified in research/R1_static_rules.md, 2026-09-25):
#     SkillGate      MIT         https://github.com/awsm-research/skillgate
#     SkillSpector   Apache-2.0  https://github.com/NVIDIA/SkillSpector
#     Cisco          Apache-2.0  https://github.com/cisco-ai-defense/skill-scanner
#     ATR            MIT         https://github.com/Agent-Threat-Rule/agent-threat-rules
#     gitleaks       MIT         https://github.com/gitleaks/gitleaks
#     SigmaHQ        DRL 1.1     https://github.com/SigmaHQ/sigma  (author + rule link + DRL notice kept)
#     Jibberdaffle   MIT         https://github.com/Jibberdaffle12/openclaw-skillscan
#     anikrahman0    MIT         https://github.com/anikrahman0/security-skill-scanner
#   Nothing here is copied from trufflehog (AGPL-3.0) or bashlex (GPL-3.0).
#
# Sigma rules are licensed under the Detection Rule License (DRL) 1.1
# https://github.com/SigmaHQ/Detection-Rule-License/blob/main/LICENSE.Detection.Rules.md
# Findings produced from a Sigma-derived rule carry `source.author` (scan.py copies it).

version: 0
families:
  remote_install: "(a) remote install: curl/wget piped into a shell"
  encoded_exec: "(b) base64/hex/reversed payload fed to eval/exec/bash -c"
  credential_access: "(c) credential paths and secret literals"
  exfiltration: "(d) outbound data transfer to external endpoints"
  instruction_override: "(e) remote-instruction loading and prompt-injection text"

rules:

  # ---------------------------------------------------------------- (a) remote_install
  - id: A01_CURL_PIPE_SH
    family: remote_install
    severity: CRITICAL
    regex: '\bcurl\s+[^|;\n]*\|\s*(?:sudo\s+(?:-\w+\s+)*)?(?:ba|z|da|a)?sh\b'
    file_types: [any]
    description: "curl output piped straight into a shell"
    source: {name: SkillGate, rule: RCE001, license: MIT, url: "https://github.com/awsm-research/skillgate/blob/main/skillgate/classifier/attack_patterns.py"}

  - id: A02_WGET_PIPE_SH
    family: remote_install
    severity: CRITICAL
    regex: '\bwget\s+[^|;\n]*\|\s*(?:sudo\s+(?:-\w+\s+)*)?(?:ba|z|da|a)?sh\b'
    file_types: [any]
    description: "wget output piped straight into a shell"
    source: {name: SkillSpector, rule: SC2, license: Apache-2.0, url: "https://github.com/NVIDIA/SkillSpector/blob/main/src/skillspector/nodes/analyzers/static_patterns_supply_chain.py", note: "differs from upstream: argument span excludes ; and newline, zsh/dash/ash and sudo flags added"}

  - id: A03_CURL_SAVE_THEN_SH
    family: remote_install
    severity: HIGH
    regex: '\b(?:curl|wget)\s+[^&\n]*(?:-o|-O|--output)\s+\S+\s*(?:&&|;)\s*(?:sudo\s+)?(?:chmod\s+\+x\s+\S+\s*(?:&&|;)\s*)?(?:(?:ba|z)?sh|\./)\S*'
    file_types: [any]
    description: "download to a file, then execute it in the same command"
    source: {name: SkillSpector, rule: SC2, license: Apache-2.0, url: "https://github.com/NVIDIA/SkillSpector/blob/main/src/skillspector/nodes/analyzers/static_patterns_supply_chain.py", note: "differs from upstream (curl -o file && sh): wget, --output, ; separator, chmod +x and ./ forms added"}

  - id: A04_SH_PROCESS_SUBST
    family: remote_install
    severity: CRITICAL
    regex: '\b(?:ba|z)?sh\s+(?:-\w+\s+)*<\(\s*(?:curl|wget)\b'
    file_types: [any]
    description: "bash <(curl ...) process substitution"
    source: {name: ours, license: MIT, url: "https://github.com/tree-sitter/tree-sitter-bash", note: "case found while testing tree-sitter-bash in R1 section 7.4"}

  - id: A05_SH_C_CMDSUBST_CURL
    family: remote_install
    severity: HIGH
    regex: '\b(?:ba|z)?sh\s+-c\s+["'']?\$\(\s*(?:curl|wget)\b'
    file_types: [any]
    description: 'bash -c "$(curl ...)" (Homebrew-style installer)'
    source: {name: ours, license: MIT}

  - id: A06_SHELL_PIPE_SHELL
    family: remote_install
    severity: MEDIUM
    regex: '\b(?:ba)?sh\s+-c\s+[^\n]*\|\s*(?:ba)?sh\b'
    file_types: [shell, markdown]
    description: "shell that executes something and pipes it into another shell"
    source: {name: SigmaHQ, rule: "Linux Shell Pipe to Shell", sigma_id: 880973f3-9708-491c-a77b-2a35a1921158, author: "Florian Roth (Nextron Systems)", license: "DRL 1.1", url: "https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_susp_pipe_shell.yml"}

  - id: A07_PY_EXEC_REMOTE_BODY
    family: remote_install
    severity: CRITICAL
    regex: '\b(?:exec|eval)\s*\(\s*(?:requests\.get|urllib\.request\.urlopen|urlopen|httpx\.get)\s*\('
    file_types: [python, markdown]
    description: "exec() of a freshly downloaded HTTP body"
    source: {name: SkillSpector, rule: agent_skill_remote_bootstrap_execution, license: Apache-2.0, url: "https://github.com/NVIDIA/SkillSpector/blob/main/src/skillspector/yara_rules/agent_skills.yar", note: "differs from upstream YARA (exec/eval of urlopen(...).read()): requests.get and httpx.get added, .read() not required"}

  - id: A08_POWERSHELL_IEX_DOWNLOAD
    family: remote_install
    severity: HIGH
    regex: '\b(?:iex|Invoke-Expression)\b[^\n]{0,40}(?:New-Object\s+Net\.WebClient|DownloadString|iwr\b|Invoke-WebRequest|curl\b)|(?:DownloadString|Invoke-WebRequest|iwr\b)[^\n]{0,80}\|\s*(?:iex|Invoke-Expression)\b'
    file_types: [any]
    description: "PowerShell download-and-invoke"
    source: {name: Jibberdaffle, rule: DOC_BLOCKER_PATTERNS, license: MIT, url: "https://github.com/Jibberdaffle12/openclaw-skillscan/blob/main/skill_scan.sh"}

  - id: A09_NODE_EXEC_REMOTE
    family: remote_install
    severity: HIGH
    regex: '\b(?:eval|Function|vm\.runInThisContext)\s*\(\s*(?:await\s+)?(?:\(\s*await\s+)?fetch\s*\(|child_process[^\n]{0,60}(?:curl|wget)[^\n]{0,80}\|\s*(?:ba)?sh'
    file_types: [js, markdown]
    description: "Node: eval(fetch(...)) or child_process running curl|sh"
    source: {name: ours, license: MIT}

  # ---------------------------------------------------------------- (b) encoded_exec
  - id: B01_BASE64_DECODE_PIPE_SH
    family: encoded_exec
    severity: CRITICAL
    regex: '\bbase64\s+(?:-d|-D|--decode)\b[^|\n]*\|\s*(?:sudo\s+)?(?:ba|z|da|a)?sh\b'
    file_types: [any]
    description: "base64 -d ... | sh"
    source: {name: SigmaHQ, rule: "Linux Base64 Encoded Pipe to Shell", sigma_id: ba592c6d-6888-43c3-b8c6-689b8fe47337, author: "pH-T (Nextron Systems)", license: "DRL 1.1", url: "https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_base64_execution.yml", also: "SkillGate RCE010 (MIT)"}

  - id: B02_ECHO_B64_DECODE
    family: encoded_exec
    severity: HIGH
    regex: '\becho\s+(?:-\w+\s+)*["'']?[A-Za-z0-9+/=]{24,}["'']?\s*\|\s*base64\s+(?:-d|-D|--decode)\b'
    file_types: [any]
    description: "inline base64 blob decoded on the command line"
    source: {name: ours, license: MIT}

  - id: B03_PY_EXEC_B64DECODE
    family: encoded_exec
    severity: CRITICAL
    regex: '\b(?:exec|eval)\s*\(\s*(?:base64\.)?(?:b64decode|urlsafe_b64decode|b32decode|a85decode)\s*\('
    file_types: [python, markdown]
    description: "exec(base64.b64decode(...))"
    source: {name: SkillSpector, rule: SC3, license: Apache-2.0, url: "https://github.com/NVIDIA/SkillSpector/blob/main/src/skillspector/nodes/analyzers/static_patterns_supply_chain.py", note: "differs from upstream: urlsafe_b64decode, b32decode, a85decode added"}

  - id: B04_PY_EXEC_COMPILE
    family: encoded_exec
    severity: HIGH
    regex: '\b(?:exec|eval)\s*\(\s*compile\s*\('
    file_types: [python, markdown]
    description: "exec(compile(...)) - source string built at runtime"
    source: {name: SkillSpector, rule: SC3, license: Apache-2.0, url: "https://github.com/NVIDIA/SkillSpector/blob/main/src/skillspector/nodes/analyzers/static_patterns_supply_chain.py", note: "widened from exec(compile([^)]*base64) to any exec(compile("}

  - id: B05_PY_DECODE_THEN_EXEC_WINDOW
    family: encoded_exec
    severity: HIGH
    regex: '\b(?:b64decode|bytes\.fromhex|codecs\.decode|zlib\.decompress|marshal\.loads|lzma\.decompress)\s*\([\s\S]{0,400}?\b(?:exec|eval|os\.system|subprocess\.(?:run|Popen|call)|__import__)\s*\('
    file_types: [python]
    description: "decode/decompress call followed within 400 chars by exec/eval/subprocess"
    source: {name: Cisco, rule: "code_execution_generic.yara $obfuscated_exec", license: Apache-2.0, url: "https://github.com/cisco-ai-defense/skill-scanner/blob/main/skill_scanner/data/packs/core/yara/code_execution_generic.yara", note: "window widened, decoders added"}

  - id: B06_PY_EXEC_REVERSED_OR_JOIN
    family: encoded_exec
    severity: HIGH
    regex: '\b(?:exec|eval)\s*\(\s*(?:["'']{2}\.join\s*\(|str\.join\s*\(|"".join\(map\(chr|bytes\s*\(\s*\[)'
    file_types: [python]
    description: "exec of a string assembled from reversed/chr/byte lists"
    source: {name: ours, license: MIT}

  - id: B07_JS_EVAL_ATOB
    family: encoded_exec
    severity: CRITICAL
    regex: '\b(?:eval|Function|new\s+Function)\s*\(\s*atob\s*\('
    file_types: [js, markdown]
    description: "eval(atob(...))"
    source: {name: SkillSpector, rule: SC3, license: Apache-2.0, url: "https://github.com/NVIDIA/SkillSpector/blob/main/src/skillspector/nodes/analyzers/static_patterns_supply_chain.py", note: "differs from upstream: the two upstream patterns (eval(atob( and new Function(atob() merged, bare Function( added"}

  - id: B08_JS_BUFFER_B64_THEN_EXEC
    family: encoded_exec
    severity: HIGH
    regex: 'Buffer\.from\s*\([^\n]*["'']base64["'']\s*\)[\s\S]{0,300}?\b(?:eval|new\s+Function|child_process|execSync|spawn)\b'
    file_types: [js]
    description: "Buffer.from(..., 'base64') followed by eval/exec"
    source: {name: anikrahman0, license: MIT, url: "https://github.com/anikrahman0/security-skill-scanner/blob/main/scanner.js", note: "original only matched Buffer.from(...base64); exec window is ours"}

  - id: B09_PY_C_INLINE_BASE64
    family: encoded_exec
    severity: HIGH
    regex: '\bpython[23]?(?:\.exe)?\s+-c\s+["''][^"''\n]*\bbase64\b'
    file_types: [any]
    description: "python -c one-liner containing base64"
    source: {name: SkillGate, rule: SIGMA033, license: MIT, url: "https://github.com/awsm-research/skillgate/blob/main/skillgate/classifier/sigma_patterns.py", sigma_id: 55e862a8-dd9c-4651-807a-f21fcad56716, author: "Hugh Ryan (HueCodes), Swachchhanda Shrawan Poudel (Nextron Systems)", sigma_url: "https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_python_base64_encoded_execution.yml", note: "rewritten as a plain regex; Sigma original is proc_creation_lnx_python_base64_encoded_execution (DRL 1.1), author kept per DRL 1.1"}

  - id: B10_SHELL_EVAL_CMDSUBST
    family: encoded_exec
    severity: HIGH
    regex: '\beval\s+["'']?\$\(\s*(?:curl|wget|base64|echo|printf|xxd|rev)\b'
    file_types: [shell, markdown]
    description: "eval $(curl|base64|echo ...)"
    source: {name: Jibberdaffle, rule: DOC_WARNING_PATTERNS, license: MIT, url: "https://github.com/Jibberdaffle12/openclaw-skillscan/blob/main/skill_scan.sh"}

  - id: B12_POWERSHELL_ENCODED
    family: encoded_exec
    severity: HIGH
    regex: '\bpowershell(?:\.exe)?\b[^\n]{0,80}\s-(?:e|ec|enc|encodedcommand)\s+[A-Za-z0-9+/=]{16,}'
    file_types: [any]
    description: "powershell -EncodedCommand"
    source: {name: Jibberdaffle, rule: DOC_BLOCKER_PATTERNS, license: MIT, url: "https://github.com/Jibberdaffle12/openclaw-skillscan/blob/main/skill_scan.sh"}

  # ---------------------------------------------------------------- (c) credential_access
  - id: C01_SSH_KEY_PATH
    family: credential_access
    severity: HIGH
    regex: '(?:~|\$HOME|/home/\w+|/Users/\w+|/root)?/\.ssh/(?:id_rsa|id_ed25519|id_ecdsa|id_dsa|authorized_keys|known_hosts|config)\b'
    file_types: [any]
    description: "SSH private key / authorized_keys path"
    source: {name: SkillSpector, rule: PE3, license: Apache-2.0, url: "https://github.com/NVIDIA/SkillSpector/blob/main/src/skillspector/nodes/analyzers/static_patterns_privilege_escalation.py", also: "SkillGate CRED001-019 (MIT)", note: "differs from upstream: config added to the file list, $HOME / /home / /Users / /root prefixes added"}

  - id: C02_AWS_CREDENTIALS_PATH
    family: credential_access
    severity: CRITICAL
    regex: '\.aws/(?:credentials|config)\b'
    file_types: [any]
    description: "AWS credentials file"
    source: {name: SkillGate, rule: CRED010, license: MIT, url: "https://github.com/awsm-research/skillgate/blob/main/skillgate/classifier/attack_patterns.py"}

  - id: C03_DOTENV_READ
    family: credential_access
    severity: HIGH
    regex: '\b(?:cat|source|less|head|tail|open|read_text|readFile\w*|Get-Content|type)\b[^\n]{0,80}[\s/"''=(]\.env(?:\.local|\.production|\.development|\.prod)?\b'
    file_types: [any]
    description: ".env file being read (not merely mentioned)"
    source: {name: SkillSpector, rule: PE3, license: Apache-2.0, url: "https://github.com/NVIDIA/SkillSpector/blob/main/src/skillspector/nodes/analyzers/static_patterns_privilege_escalation.py", note: "narrowed to a read verb to cut false positives"}

  - id: C04_MACOS_KEYCHAIN
    family: credential_access
    severity: HIGH
    regex: '\bsecurity\s+(?:-\w+\s+)*(?:find-(?:generic|internet)-password|dump-keychain|export|find-certificate|login-keychain)\b|Library/Keychains/'
    file_types: [any]
    description: "macOS `security` keychain dump / Keychains folder"
    source: {name: SigmaHQ, rule: "Credentials from Password Stores - Keychain", sigma_id: b120b587-a4c2-4b94-875d-99c9807d6955, author: "Tim Ismilyaev, oscd.community, Florian Roth (Nextron Systems)", license: "DRL 1.1", url: "https://github.com/SigmaHQ/sigma/blob/master/rules/macos/process_creation/proc_creation_macos_creds_from_keychain.yml", also: "SkillGate CRED019 (MIT) for Library/Keychains/", note: "Sigma covers find-certificate, export, dump-keychain, login-keychain; find-generic-password and find-internet-password added by us; Library/Keychains/ comes from SkillGate CRED019"}

  - id: C05_BROWSER_PROFILE_STORE
    family: credential_access
    severity: HIGH
    regex: '(?:Google/Chrome|BraveSoftware|Mozilla/Firefox|Microsoft/Edge|Chromium)/[^\n]{0,60}(?:Default|Profiles?)|\b(?:Login Data|Web Data|logins\.json|key[34]\.db|cookies\.sqlite|places\.sqlite)\b'
    file_types: [any]
    description: "browser profile / saved-password store"
    source: {name: ours, license: MIT}

  - id: C06_OTHER_CRED_FILES
    family: credential_access
    severity: HIGH
    regex: '\.(?:kube/config|docker/config\.json|npmrc|pypirc|git-credentials|netrc|pgpass|config/gcloud/|azure/accessTokens\.json|gnupg/)\b'
    file_types: [any]
    description: "kube/docker/npm/pypi/git/netrc/gcloud credential files"
    source: {name: Cisco, rule: "credential_harvesting_generic.yara $credential_file_access", license: Apache-2.0, url: "https://github.com/cisco-ai-defense/skill-scanner/blob/main/skill_scanner/data/packs/core/yara/credential_harvesting_generic.yara", note: "list extended"}

  - id: C07_ETC_SHADOW
    family: credential_access
    severity: MEDIUM
    regex: '/etc/(?:shadow|sudoers|master\.passwd)\b'
    file_types: [any]
    description: "/etc/shadow or sudoers access"
    source: {name: anikrahman0, license: MIT, url: "https://github.com/anikrahman0/security-skill-scanner/blob/main/scanner.js"}

  - id: C08_PY_ENV_HARVEST
    family: credential_access
    severity: MEDIUM
    regex: 'os\.environ(?:\.items\(\)|\.copy\(\)|\))[\s\S]{0,200}?["''](?:TOKEN|SECRET|KEY|PASSW|CREDENTIAL|API)'
    file_types: [python]
    description: "os.environ dump filtered by TOKEN/SECRET/KEY"
    source: {name: ours, license: MIT}

  - id: C09_SHELL_ENV_DUMP
    family: credential_access
    severity: MEDIUM
    regex: '\b(?:env|printenv|set)\s*\|\s*(?:grep\s+-i?E?\s*["'']?(?:key|token|secret|pass)|curl|base64|nc)\b'
    file_types: [shell, markdown]
    description: "env | grep secret / env | curl"
    source: {name: ours, license: MIT}

  - id: C10_AWS_KEY_LITERAL
    family: credential_access
    severity: MEDIUM
    case_sensitive: true
    regex: '\b((?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16})\b'
    file_types: [any]
    description: "hard-coded AWS access key id"
    source: {name: gitleaks, rule: aws-access-token, license: MIT, url: "https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml"}

  - id: C11_GITHUB_PAT_LITERAL
    family: credential_access
    severity: MEDIUM
    case_sensitive: true
    regex: 'ghp_[0-9a-zA-Z]{36}'
    file_types: [any]
    description: "hard-coded GitHub personal access token"
    source: {name: gitleaks, rule: github-pat, license: MIT, url: "https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml"}

  - id: C12_OPENAI_KEY_LITERAL
    family: credential_access
    severity: MEDIUM
    case_sensitive: true
    regex: '\bsk-[a-zA-Z0-9]{20}T3BlbkFJ[a-zA-Z0-9]{20}\b'
    file_types: [any]
    description: "hard-coded OpenAI API key (legacy format)"
    source: {name: gitleaks, rule: openai-api-key, license: MIT, url: "https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml", note: "only the second alternative of the upstream regex"}

  - id: C13_PRIVATE_KEY_BLOCK
    family: credential_access
    severity: MEDIUM
    regex: '-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY(?: BLOCK)?-----'
    file_types: [any]
    description: "PEM private key block embedded in the skill"
    source: {name: gitleaks, rule: private-key, license: MIT, url: "https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml", note: "differs from upstream: upstream requires the whole block (BEGIN header, 64+ chars of body, END footer); ours matches the BEGIN header only"}

  # ---------------------------------------------------------------- (d) exfiltration
  - id: D01_CURL_UPLOAD_FLAGS
    family: exfiltration
    severity: HIGH
    regex: '\bcurl\s+[^\n]{0,200}\s(?:-d|--data(?:-binary|-raw|-urlencode)?|-F|--form|-T|--upload-file)\s'
    file_types: [any]
    description: "curl sending a body or file"
    source: {name: SkillGate, rule: EXFIL001, license: MIT, url: "https://github.com/awsm-research/skillgate/blob/main/skillgate/classifier/attack_patterns.py", also: "ATR-2026-00201 (MIT)"}

  - id: D02_CURL_ARGV_LIST_POST
    family: exfiltration
    severity: HIGH
    regex: '["'']curl["'']\s*,[^\n]{0,240}["''](?:-d|--data(?:-binary|-raw)?|-F|-T|--upload-file|POST|PUT)["'']'
    file_types: [python, js]
    description: "subprocess/spawn argv list running curl with an upload flag or POST"
    source: {name: ours, license: MIT}

  - id: D03_CURL_X_POST
    family: exfiltration
    severity: MEDIUM
    regex: '\bcurl\s+[^\n]{0,160}\s-X\s*["'']?(?:POST|PUT)\b'
    file_types: [any]
    description: "curl -X POST (weak alone: common in API docs)"
    source: {name: SkillGate, rule: EXFIL001, license: MIT, url: "https://github.com/awsm-research/skillgate/blob/main/skillgate/classifier/attack_patterns.py"}

  - id: D04_WGET_POST
    family: exfiltration
    severity: HIGH
    regex: '\bwget\s+[^\n]{0,160}--post-(?:data|file)\b'
    file_types: [any]
    description: "wget --post-data / --post-file"
    source: {name: SkillGate, rule: EXFIL101, license: MIT, url: "https://github.com/awsm-research/skillgate/blob/main/skillgate/classifier/attack_patterns.py"}

  - id: D05_PY_POST_WITH_SENSITIVE
    family: exfiltration
    severity: HIGH
    regex: '\b(?:requests|httpx|session|client)\.(?:post|put|patch)\s*\([\s\S]{0,300}?(?:read_text|open\s*\(|environ|\.ssh|\.aws|\.env\b|credential|token|secret|password|passwd)'
    file_types: [python]
    description: "HTTP POST whose argument window mentions files/env/secrets"
    source: {name: Cisco, rule: DATA_EXFIL_HTTP_POST, license: Apache-2.0, url: "https://github.com/cisco-ai-defense/skill-scanner/blob/main/skill_scanner/data/packs/core/signatures/data_exfiltration.yaml", note: "upstream has two patterns: host words (attacker, evil, webhook, ...) and a payload pattern on data=/json= mentioning password/secret/token; ours drops the host-word pattern, widens requests to httpx/session/client and the window to 300 chars"}

  - id: D06_PY_URLLIB_POST
    family: exfiltration
    severity: MEDIUM
    regex: 'urllib\.request\.(?:Request|urlopen)\s*\([^\n]{0,200}(?:data\s*=|method\s*=\s*["''](?:POST|PUT))'
    file_types: [python]
    description: "urllib POST with a body"
    source: {name: ours, license: MIT}

  - id: D07_NETCAT_OR_DEVTCP
    family: exfiltration
    severity: HIGH
    regex: '\b(?:nc|ncat|netcat)\s+(?:-\w+\s+)*[\w.-]+\s+\d{2,5}\b|/dev/(?:tcp|udp)/[\w.-]+/\d+'
    file_types: [shell, python, js, markdown]
    description: "netcat or bash /dev/tcp socket"
    source: {name: SkillGate, rule: "SHELL012, SHELL001", license: MIT, url: "https://github.com/awsm-research/skillgate/blob/main/skillgate/classifier/attack_patterns.py"}

  - id: D08_COLLECTOR_ENDPOINTS
    family: exfiltration
    severity: HIGH
    regex: 'discord(?:app)?\.com/api/webhooks|api\.telegram\.org/bot|hooks\.slack\.com/services|webhook\.site|pipedream\.net|requestbin|burpcollaborator|oastify\.com|interact\.sh|ngrok(?:-free)?\.(?:app|io|dev)|\.workers\.dev\b|pastebin\.com/(?:api|raw)|transfer\.sh|file\.io\b'
    file_types: [any]
    description: "known data-collector / throwaway-endpoint domains"
    source: {name: SkillSpector, rule: "agent_skills.yar $collector_*", license: Apache-2.0, url: "https://github.com/NVIDIA/SkillSpector/blob/main/src/skillspector/yara_rules/agent_skills.yar", note: "domain list extended by us"}

  - id: D09_BASE64_PIPE_NETWORK
    family: exfiltration
    severity: HIGH
    regex: '\bbase64\b[^\n]*\|\s*(?:curl|wget|nslookup|dig|nc)\b'
    file_types: [any]
    description: "base64-encoded data piped into a network command (DNS/HTTP exfil)"
    source: {name: SkillGate, rule: EXFIL120, license: MIT, url: "https://github.com/awsm-research/skillgate/blob/main/skillgate/classifier/attack_patterns.py"}

  - id: D10_DNS_QUERY_WITH_DATA
    family: exfiltration
    severity: HIGH
    regex: '\b(?:nslookup|dig|host)\s+[^\n]*(?:\$\(|`|\$\{?[A-Za-z_])[^\n]*\.[a-z]{2,}'
    file_types: [shell, markdown]
    description: "DNS lookup whose name contains a variable or command substitution"
    source: {name: SkillGate, rule: "EXFIL110, EXFIL009", license: MIT, url: "https://github.com/awsm-research/skillgate/blob/main/skillgate/classifier/attack_patterns.py"}

  - id: D11_CRED_READ_ENCODE_SEND
    family: exfiltration
    severity: CRITICAL
    regex: '(?:cat|read)\s+[^\n]*(?:id_rsa|credentials|\.env|secret_key|private_key)[^\n]*\|\s*(?:base64|xxd|gzip)[^\n]*\|\s*(?:curl|wget|nc)'
    file_types: [any]
    description: "credential read -> encode -> exfiltrate pipeline"
    source: {name: ATR, rule: ATR-2026-00162, license: MIT, url: "https://github.com/Agent-Threat-Rule/agent-threat-rules/blob/main/rules/context-exfiltration/ATR-2026-00162-skill-credential-exfil-combo.yaml"}

  - id: D13_JS_POST_BODY
    family: exfiltration
    severity: MEDIUM
    regex: '\b(?:fetch|axios(?:\.post)?|got(?:\.post)?)\s*\([\s\S]{0,200}?(?:method\s*:\s*["'']POST|body\s*:\s*(?:JSON\.stringify)?\s*\(?\s*(?:process\.env|fs\.readFileSync|os\.homedir))'
    file_types: [js]
    description: "fetch/axios POST whose body is env or a file"
    source: {name: ours, license: MIT}

  - id: D14_SUSPICIOUS_TLD
    family: exfiltration
    severity: LOW
    regex: 'https?://[a-z0-9.-]+\.(?:xyz|tk|ml|ga|cf|gq|top|buzz|icu)\b'
    file_types: [any]
    description: "URL on a TLD frequently used by throwaway infrastructure"
    source: {name: anikrahman0, license: MIT, url: "https://github.com/anikrahman0/security-skill-scanner/blob/main/scanner.js"}

  # ---------------------------------------------------------------- (e) instruction_override
  - id: E01_IGNORE_PREVIOUS_INSTRUCTIONS
    family: instruction_override
    severity: HIGH
    regex: '\b(?:ignore|disregard|forget)\s+(?:all\s+|any\s+|the\s+|your\s+)?(?:previous|prior|above|earlier|preceding|system|original)\s+(?:instructions?|rules?|guidelines?|prompts?|directives?)'
    file_types: [markdown, any]
    description: "classic 'ignore previous instructions'"
    source: {name: SkillSpector, rule: P1, license: Apache-2.0, url: "https://github.com/NVIDIA/SkillSpector/blob/main/src/skillspector/nodes/analyzers/static_patterns_prompt_injection.py", also: "Cisco PROMPT_INJECTION_IGNORE_INSTRUCTIONS (Apache-2.0)", note: "differs from upstream (ignore (all)? previous instructions?): verbs, articles, adjectives and nouns widened by us"}

  - id: E02_IGNORE_SECURITY_WARNINGS
    family: instruction_override
    severity: HIGH
    regex: '\b(?:ignore|disregard|dismiss|suppress|bypass|skip)\s+(?:the\s+|any\s+|all\s+|these\s+)?(?:security|safety|scanner|antivirus)\s+(?:warnings?|alerts?|checks?|scans?|prompts?|findings?|flags?)|\b(?:security|safety|scanner)\s+(?:warnings?|alerts?|findings?)\s+(?:are|is)\s+(?:a\s+|just\s+|only\s+)?(?:test|false|expected|normal|harmless|known|benign|artifacts?)'
    file_types: [markdown, any]
    description: "tells the agent that security warnings are fake or should be ignored"
    source: {name: ours, license: MIT}

  - id: E03_UNRESTRICTED_MODE
    family: instruction_override
    severity: HIGH
    regex: 'you are now in\s+(?:unrestricted|debug|developer|admin|god|jailbreak)\s+mode|enter\s+(?:unrestricted|debug|developer)\s+mode|disable\s+(?:all\s+)?(?:safety|security|content|ethical)\s+(?:filters|checks|guidelines)'
    file_types: [markdown, any]
    description: "switches the model into a fake 'developer/unrestricted mode'"
    source: {name: Cisco, rule: PROMPT_INJECTION_UNRESTRICTED_MODE, license: Apache-2.0, url: "https://github.com/cisco-ai-defense/skill-scanner/blob/main/skill_scanner/data/packs/core/signatures/prompt_injection.yaml", note: "three upstream patterns merged into one alternation"}

  - id: E04_DO_NOT_TELL_USER
    family: instruction_override
    severity: HIGH
    regex: '\b(?:do\s+not|don''t|never|without|avoid)\s+(?:ever\s+)?(?:tell(?:ing)?|inform(?:ing)?|notify(?:ing)?|alert(?:ing)?|show(?:ing)?|reveal(?:ing)?|disclos(?:e|ing)|mention(?:ing)?)\s+(?:this\s+|it\s+|that\s+|anything\s+|these\s+steps\s+)?(?:to\s+)?the\s+user'
    file_types: [markdown, any]
    description: "instructs the agent to hide something from the user"
    source: {name: SkillGate, rule: SKILL_INJ001, license: MIT, url: "https://github.com/awsm-research/skillgate/blob/main/rules/skills.yaml"}

  - id: E05_SILENT_EXECUTION
    family: instruction_override
    severity: MEDIUM
    regex: '\b(?:silently|quietly|covertly|discreetly|without\s+(?:user\s+)?(?:confirmation|asking|prompting|notice|announcing|logging))\b[^\n]{0,60}\b(?:run|execute|install|send|upload|delete|call)\b|\b(?:run|execute|install|send|upload)\b[^\n]{0,60}\b(?:silently|quietly|covertly|without\s+(?:user\s+)?(?:confirmation|asking|prompting|notice))\b'
    file_types: [markdown]
    description: "run/send something silently or without confirmation"
    source: {name: ours, license: MIT, also: "Cisco YARA coercive_injection_generic (idea)"}

  - id: E06_MANDATORY_PREFLIGHT_SCRIPT
    family: instruction_override
    severity: MEDIUM
    regex: '\b(?:pre-?flight|before\s+(?:producing|responding|answering|generating|any\s+(?:other\s+)?(?:step|action|response|output))|always\s+(?:first\s+)?(?:execute|run)|must\s+(?:first\s+)?(?:execute|run))\b[^\n]{0,120}\b(?:execute|run)?\s*`?(?:python3?|bash|sh|node)\s+\S*(?:/_\w+|bootstrap|provision|setup|init|stage|helper)\w*\.(?:py|sh|js)'
    file_types: [markdown]
    description: "SKILL.md forces the agent to run a helper script before every task"
    source: {name: ours, license: MIT}

  - id: E07_FETCH_URL_THEN_FOLLOW
    family: instruction_override
    severity: HIGH
    regex: '\b(?:fetch|download|read|load|retrieve|get|visit|open)\s+[^\n]{0,60}(?:https?://\S+|the\s+(?:url|link|endpoint|remote\s+file))[^\n]{0,80}\b(?:follow|execute|run|apply|obey|comply\s+with|treat\s+(?:it|them|the\s+(?:content|response|result))\s+as)\s+(?:the\s+|its\s+|those\s+|these\s+|any\s+)?(?:instructions?|commands?|directives?|steps|rules)|\b(?:instructions?|commands?|directives?)\s+(?:are\s+|can\s+be\s+|will\s+be\s+)?(?:located|found|hosted|available|stored|updated)\s+at\s+https?://'
    file_types: [markdown]
    description: "fetch a URL and then treat its content as instructions"
    source: {name: Cisco, rule: check_active_remote_execution (idea), license: Apache-2.0, url: "https://github.com/cisco-ai-defense/skill-scanner/blob/main/docs/architecture/analyzers/static-analyzer.md", note: "differs from upstream: upstream is a Python function, not a regex; only the idea is taken, the regex is ours"}

  - id: E08_CHAT_TEMPLATE_TOKENS
    family: instruction_override
    severity: HIGH
    case_sensitive: true
    regex: '<\|im_start\|>|<\|im_end\|>|\[INST\]|<<SYS>>|<\|system\|>|<\|endoftext\|>|<\|assistant\|>'
    file_types: [any]
    description: "raw chat-template control tokens (ChatML / LLaMA)"
    source: {name: SkillGate, rule: "INJ006, INJ007", license: MIT, url: "https://github.com/awsm-research/skillgate/blob/main/skillgate/classifier/attack_patterns.py"}

  - id: E09_ROLE_REASSIGNMENT
    family: instruction_override
    severity: MEDIUM
    regex: '\byou\s+are\s+(?:now\s+)?(?:a|an|the)?\s*(?:unrestricted|jailbroken|uncensored|evil|rogue)\b|\bact\s+as\s+(?:if\s+you\s+(?:have|are)\s+)?(?:no|without)\s+(?:restrictions|limits|limitations|filters|rules)|\bpretend\s+(?:that\s+)?you\s+(?:have\s+no|are\s+not\s+bound\s+by)'
    file_types: [markdown, any]
    description: "role reassignment / no-limits persona"
    source: {name: ours, license: MIT, also: "Cisco PROMPT_INJECTION_* family (idea)"}

  - id: E10_OVERRIDE_SYSTEM_SAFETY
    family: instruction_override
    severity: HIGH
    regex: '\boverride\s+(?:the\s+|any\s+|all\s+)?(?:safety|security|system|previous|default|user)\s+(?:prompt|instructions?|settings?|rules?|guidelines|policy|policies|restrictions)'
    file_types: [markdown, any]
    description: "override safety/system instructions"
    source: {name: SkillSpector, rule: P1, license: Apache-2.0, url: "https://github.com/NVIDIA/SkillSpector/blob/main/src/skillspector/nodes/analyzers/static_patterns_prompt_injection.py", note: "differs from upstream (override (safety|security|system)): articles, more adjectives and an object noun required by us"}

  - id: E11_INSTRUCT_SEND_CONTEXT
    family: instruction_override
    severity: HIGH
    regex: '\b(?:send|post|upload|forward|transmit|include|attach|report)\s+[^\n]{0,60}\b(?:conversation|chat\s+history|system\s+prompt|api\s+keys?|credentials|tokens?|environment\s+variables|\.env|ssh\s+keys?|clipboard|browser\s+cookies)\b[^\n]{0,60}\b(?:to\s+https?://|to\s+(?:the|our|this)\s+(?:endpoint|server|webhook|url|api|backend))'
    file_types: [markdown]
    description: "SKILL.md instructs the agent to send secrets/context to a remote endpoint"
    source: {name: ATR, rule: "context-exfiltration family (idea)", license: MIT, url: "https://github.com/Agent-Threat-Rule/agent-threat-rules/tree/main/rules/context-exfiltration", note: "regex is ours"}

  - id: E12_HIDDEN_HTML_COMMENT_INSTRUCTION
    family: instruction_override
    severity: MEDIUM
    regex: '<!--[\s\S]{0,400}?\b(?:ignore|execute|run|curl|wget|secret|password|do\s+not\s+tell|system\s+prompt|instructions?)\b[\s\S]{0,400}?-->'
    file_types: [markdown]
    description: "instruction-like text hidden in an HTML comment (invisible when rendered)"
    source: {name: ours, license: MIT, also: "Cisco YARA indirect_prompt_injection_generic (idea)"}

  - id: E13_ZERO_WIDTH_RUN
    family: instruction_override
    severity: LOW
    regex: '[\u200b\u200c\u200d\u2060\ufeff]{3,}'
    file_types: [markdown]
    description: "run of zero-width characters (possible hidden text)"
    source: {name: ours, license: MIT}

