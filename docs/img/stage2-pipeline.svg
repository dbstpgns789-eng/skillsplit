<svg xmlns="http://www.w3.org/2000/svg" width="750" height="330" viewBox="0 55 750 330" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a91a0"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5bd3"/>
    </marker>
    <style>
      .t { font-size: 15px; font-weight: 700; fill: #6b7385; }
      .s { font-size: 12px; fill: #8a91a0; }
      .ln { stroke: #8a91a0; stroke-width: 1.8; fill: none; marker-end: url(#ar); }
    </style>
  </defs>
  <rect x="0" y="55" width="750" height="330" fill="#ffffff"/>

  <!-- 스킬 -->
  <rect x="20" y="150" width="150" height="96" rx="10" fill="#f7f8fb" stroke="#c3c8d3"/>
  <text x="95" y="186" text-anchor="middle" class="t">스킬</text>
  <text x="95" y="208" text-anchor="middle" class="s">MaliciousSkillBench</text>
  <text x="95" y="226" text-anchor="middle" class="s">dev → held-out</text>

  <path class="ln" d="M170 198 H190 V110 H216"/>
  <path class="ln" d="M190 198 V272 H216"/>

  <!-- 1단계 -->
  <rect x="218" y="70" width="300" height="80" rx="10" fill="#fbfaf6" stroke="#e3d3ad"/>
  <text x="368" y="104" text-anchor="middle" class="t">1단계 정적 탐지기</text>
  <text x="368" y="126" text-anchor="middle" class="s">위험한 글자 패턴</text>

  <!-- 2단계 -->
  <rect x="218" y="176" width="300" height="196" rx="10" fill="#f7f8fb" stroke="#c3c8d3"/>
  <text x="368" y="200" text-anchor="middle" class="t">2단계 설명서 판정기</text>
  <text x="368" y="218" text-anchor="middle" class="s">같은 스킬을 두 버전이 따로 판정</text>
  <rect x="234" y="230" width="268" height="52" rx="8" fill="#f4faf6" stroke="#b7d8c3"/>
  <text x="368" y="253" text-anchor="middle" class="t">LLM 버전 (Claude)</text>
  <text x="368" y="271" text-anchor="middle" class="s">말로 판단 → 판정 + 확신도 → 점수</text>

  <!-- Jev 강조 -->
  <rect x="228" y="292" width="280" height="70" rx="10" fill="#2f5bd3"/>
  <text x="368" y="322" text-anchor="middle" style="font-size:17px;font-weight:700" fill="#ffffff">Jev 버전 (TypeSafe)</text>
  <text x="368" y="344" text-anchor="middle" style="font-size:12.5px" fill="#e3ecff">질문 3개 → 악성 확률 = 점수</text>

  <!-- 채점 -->
  <path class="ln" d="M518 110 H560 V198 H578"/>
  <path class="ln" d="M518 256 H560 V198"/>
  <path d="M508 327 H560 V214 H578" stroke="#2f5bd3" stroke-width="3" fill="none" marker-end="url(#arb)"/>
  <rect x="580" y="150" width="140" height="96" rx="10" fill="#1d2330"/>
  <text x="650" y="196" text-anchor="middle" style="font-size:15px;font-weight:700" fill="#fff">채점</text>
  <text x="650" y="218" text-anchor="middle" style="font-size:12px" fill="#d9dde5">정답과 비교</text>

  <!-- 설명 꼬리표 -->
  <rect x="572" y="290" width="164" height="62" rx="8" fill="#e3ecff" stroke="#2f5bd3" stroke-width="1.5"/>
  <text x="654" y="314" text-anchor="middle" style="font-size:13px;font-weight:700" fill="#2f5bd3">Jev = 2단계 자리의</text>
  <text x="654" y="334" text-anchor="middle" style="font-size:13px;font-weight:700" fill="#2f5bd3">또 다른 판정기</text>
</svg>
